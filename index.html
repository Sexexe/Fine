<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>DJ BOX PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a12;--panel:#0f0f18;--edge:#26263a;--ink:#e9edf5;--mut:#6b6b85;
--acc:#5b4bff;--acc-2:#7c6cff;--acc-glow:rgba(91,75,255,.55);--acc-glow-soft:rgba(91,75,255,.25);
--red:#ff3b4b;--green:#3dff8e;--lcd:#05060f;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden;touch-action:manipulation}
.app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:12px 16px;max-width:1320px;margin:0 auto;overflow:hidden}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;flex:none;padding:0 4px}
.brand b{font:900 20px/1 Orbitron;letter-spacing:.04em;color:#fff}
.brand b i{font-style:normal;color:var(--acc-2);text-shadow:0 0 14px var(--acc-glow)}
.rec-top{grid-column:2;justify-self:center;display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:22px;font:800 12px Orbitron;letter-spacing:.14em;color:#ffb3ba;cursor:pointer;background:linear-gradient(180deg,#2a1218,#1a0b10);border:1px solid #5c1f26;box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);transition:.15s}
.rec-top .dot{width:9px;height:9px;border-radius:50%;background:#5c2127}
.rec-top.on{color:#fff;border-color:var(--red);box-shadow:0 0 26px rgba(255,59,75,.55)}
.rec-top.on .dot{background:var(--red);box-shadow:0 0 10px var(--red);animation:recPulse 1s infinite}
.rec-top .time{font-family:"Share Tech Mono";color:#fff}
@keyframes recPulse{50%{opacity:.4}}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 260px minmax(0,1fr);gap:14px}
.panel{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#13131d 0%,#0d0d16 100%);border:1px solid #1a1a26;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),inset 0 -1px 0 rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.55)}
.panel-tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);font:800 9px Orbitron;letter-spacing:.4em;color:#7d7da0;pointer-events:none;z-index:3}
.deck{display:flex;flex-direction:column;align-items:center;padding:24px 16px 18px;min-height:0;gap:14px}
.vinyl{position:relative;border:none;background:none;cursor:pointer;width:190px;aspect-ratio:1;flex:none;transition:transform .2s}
.vinyl:active{transform:scale(.985)}
.vinyl .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 25%,rgba(255,255,255,.06),transparent 40%),repeating-radial-gradient(circle at center,#05060c 0 1.5px,#1a1a28 1.5px 3px);box-shadow:0 0 0 2px #000,0 0 0 3px #23233a,0 12px 26px rgba(0,0,0,.85),inset 0 0 40px rgba(0,0,0,.95);display:grid;place-items:center}
.vinyl .lab{width:40%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 28%,#8a7cff 0%,var(--acc-2) 40%,var(--acc) 70%,#2a1fa8 100%);box-shadow:0 0 0 3px #05060c,0 0 22px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.5);font:900 26px Orbitron;color:#fff}
.vinyl::after{content:"";position:absolute;top:4%;right:8%;width:4px;height:34%;border-radius:2px;background:linear-gradient(180deg,#fff,#b9b9d0);transform:rotate(28deg);box-shadow:0 0 10px rgba(255,255,255,.6);pointer-events:none}
.vinyl.spinning .disc{animation:spin 1.9s linear infinite}
.vinyl.empty .disc{animation:pulseRing 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 2px #000,0 0 0 3px #23233a,0 12px 26px rgba(0,0,0,.85),inset 0 0 40px rgba(0,0,0,.95),0 0 10px var(--acc-glow-soft)}50%{box-shadow:0 0 0 2px #000,0 0 0 3px var(--acc),0 12px 26px rgba(0,0,0,.85),inset 0 0 40px rgba(0,0,0,.95),0 0 40px var(--acc-glow)}}
.lcd{background:var(--lcd);border:1px solid #000;border-radius:10px;font-family:"Share Tech Mono",monospace;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.05)}
.title{width:100%;max-width:280px;padding:9px 12px;text-align:center;font-size:13px;color:#e6e6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 2px 8px rgba(0,0,0,.95),0 0 20px var(--acc-glow-soft)}
.title small{display:block;font-size:12px;color:#8b8bff;margin-top:2px}
.bpm-big{font:800 22px "Share Tech Mono";color:#8b8bff;text-shadow:0 0 12px var(--acc-glow)}
.time{width:100%;max-width:280px;padding:6px 12px;text-align:center;font-size:12px;color:#a0a0c8}
.transport{display:flex;gap:14px;align-items:center;margin-top:2px}
.cbtn{width:52px;height:52px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font:700 20px "Chakra Petch";color:#dfe0ff;background:linear-gradient(180deg,#1d1d2e,#0f0f1a);border:1px solid #26263a;box-shadow:0 3px 0 #05060c,0 6px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);transition:.15s}
.cbtn:active{transform:translateY(2px);box-shadow:0 0 0 #05060c,inset 0 3px 8px rgba(0,0,0,.7)}
.cbtn.on{color:#fff;background:radial-gradient(circle at 40% 30%,#8a7cff 0%,var(--acc-2) 45%,var(--acc) 90%);border-color:var(--acc-2);box-shadow:0 0 26px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 #1c1274}
.fx-block{width:100%;max-width:300px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch;margin-top:6px}
.fx-rows{display:flex;flex-direction:column;gap:10px;justify-content:space-between;padding:10px 4px}
.fx-row{display:grid;grid-template-columns:40px 1fr 32px;align-items:center;gap:10px}
.fx-row .lab{font:700 10px "Chakra Petch";letter-spacing:.16em;color:var(--mut)}
.fx-row .val{font:12px "Share Tech Mono";color:#8b8bff;text-align:right}
.hfader{position:relative;height:22px;cursor:pointer;touch-action:none}
.hfader .rail{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:5px;border-radius:3px;background:#05060c;box-shadow:inset 0 1px 3px rgba(0,0,0,.9)}
.hfader .fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--acc-2));filter:drop-shadow(0 0 6px var(--acc-glow-soft))}
.hfader .thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#8a7cff 0%,var(--acc) 55%,#2a1fa8 100%);box-shadow:0 0 12px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.5),0 3px 6px rgba(0,0,0,.6)}
.inv{width:56px;border-radius:12px;cursor:pointer;font:800 12px Orbitron;letter-spacing:.1em;color:#a0a0c8;background:linear-gradient(180deg,#1a1a26,#0d0d16);border:1px solid #26263a;box-shadow:0 3px 0 #05060c,0 6px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);transition:.15s}
.inv:active{transform:translateY(2px);box-shadow:0 0 0 #05060c,inset 0 3px 8px rgba(0,0,0,.7)}
.inv.on{color:#fff;background:linear-gradient(180deg,#8a7cff 0%,var(--acc) 60%,#2a1fa8 100%);border-color:var(--acc-2);box-shadow:0 0 26px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 #1c1274}
.mixer{display:flex;flex-direction:column;align-items:center;padding:24px 14px 18px;gap:14px;min-height:0}
.swap-btn{width:52px;height:52px;border-radius:12px;cursor:pointer;display:grid;place-items:center;font:700 22px "Chakra Petch";color:#dfe0ff;background:linear-gradient(180deg,#1d1d2e,#0f0f1a);border:1px solid #26263a;box-shadow:0 3px 0 #05060c,0 6px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.swap-btn:active{transform:translateY(2px);box-shadow:0 0 0 #05060c,inset 0 3px 8px rgba(0,0,0,.7)}
.sync{width:82px;height:82px;border-radius:50%;cursor:pointer;font:800 14px Orbitron;letter-spacing:.1em;color:#fff;background:radial-gradient(circle at 40% 30%,#9c8fff 0%,var(--acc-2) 45%,var(--acc) 80%,#2a1fa8 100%);border:1px solid var(--acc-2);box-shadow:0 0 30px var(--acc-glow),inset 0 2px 6px rgba(255,255,255,.35),inset 0 -4px 12px rgba(0,0,0,.5),0 3px 0 #1c1274;transition:.15s}
.sync:active{transform:scale(.95)}
.mini-vu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:180px}
.mini-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.mini-col .lab{font:800 10px Orbitron;color:var(--mut)}
.mini-bar{width:8px;height:44px;border-radius:4px;background:#05060c;box-shadow:inset 0 1px 3px rgba(0,0,0,.9);position:relative;overflow:hidden}
.mini-bar i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--acc-2),var(--acc));box-shadow:0 0 10px var(--acc-glow);height:0%;transition:height .06s linear;border-radius:4px}
.mini-bar i.peak{background:linear-gradient(180deg,#ff7a86,var(--red))}
.vert-faders{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:160px;flex:1;min-height:0}
.vfader{display:flex;flex-direction:column;align-items:center;gap:8px}
.vfader .lab{font:800 11px Orbitron;color:var(--mut)}
.vfader .track{position:relative;width:8px;flex:1;min-height:100px;background:#05060c;border-radius:4px;box-shadow:inset 0 1px 4px rgba(0,0,0,.95);cursor:pointer;touch-action:none}
.vfader .track .fill{position:absolute;left:0;right:0;bottom:0;border-radius:4px;background:linear-gradient(180deg,transparent,var(--acc-2))}
.vfader .track .thumb{position:absolute;left:50%;transform:translate(-50%,50%);width:28px;height:14px;border-radius:4px;background:linear-gradient(180deg,#8a7cff,#3a2fb8);box-shadow:0 0 12px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.5)}
.xfade-round{width:100%;max-width:200px;position:relative;height:44px;display:flex;align-items:center;justify-content:center}
.xfade-round .rail{position:absolute;left:10px;right:10px;top:50%;transform:translateY(-50%);height:5px;border-radius:3px;background:#05060c;box-shadow:inset 0 1px 3px rgba(0,0,0,.95)}
.xfade-round .ball{position:absolute;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#b8aaff 0%,var(--acc-2) 45%,var(--acc) 80%,#2a1fa8 100%);box-shadow:0 0 14px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.5);cursor:grab;touch-action:none}
.statusbar{flex:none;display:flex;align-items:center;justify-content:center;padding:6px 14px;font:12px "Share Tech Mono";color:#8b8bff}
.statusbar .led{width:8px;height:8px;border-radius:50%;background:#5b4bff;box-shadow:0 0 10px var(--acc-glow);margin-right:8px}
.statusbar .led.rec{background:var(--red);box-shadow:0 0 10px var(--red);animation:recPulse 1.2s infinite}
.statusbar .led.ok{background:var(--green);box-shadow:0 0 10px var(--green)}
@media(max-width:820px){.app{padding:8px;gap:8px}.brand b{font-size:15px}.rec-top{padding:7px 12px;font-size:10px;gap:6px}.rec-top .dot{width:7px;height:7px}.stage{grid-template-columns:1fr;grid-template-rows:1fr auto 1fr;gap:8px}.deck{padding:16px 12px 12px;gap:8px}.vinyl{width:130px}.vinyl .lab{font-size:20px}.title{max-width:100%;padding:6px 10px;font-size:12px}.time{max-width:100%;padding:4px 10px;font-size:11px}.cbtn{width:44px;height:44px;font-size:16px}.fx-block{max-width:100%}.mixer{padding:14px 12px 12px;gap:10px}.sync{width:66px;height:66px;font-size:12px}.swap-btn{width:44px;height:44px;font-size:18px}.mini-vu{max-width:150px}.mini-bar{width:7px;height:36px}.vert-faders{max-width:150px;gap:14px}.vfader .track{min-height:70px}.xfade-round{max-width:160px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="brand"><b>DJ BOX <i>PRO</i></b></div>
<button class="rec-top" id="recBtn"><span class="dot"></span><span>REC</span><span class="time" id="recTime">00:00</span></button>
</header>
<main class="stage">
<section class="deck panel" data-d="A">
<span class="panel-tag">DECK A</span>
<input type="file" id="fileA" accept="audio/*" hidden>
<button class="vinyl empty" id="vinylA"><span class="disc"><span class="lab">A</span></span></button>
<div class="lcd title" id="titleA">— NO TRACK —<small>BPM <b class="bpm-big" id="bpmA">---</b></small></div>
<div class="lcd time" id="timeA">00:00 / 00:00</div>
<div class="transport"><button class="cbtn play" id="playA">▶</button><button class="cbtn loop" id="loopA">↻</button></div>
<div class="fx-block">
<div class="fx-rows">
<div class="fx-row"><span class="lab">BASS</span><div class="hfader" id="bassA"></div><span class="val" id="bassAv">0</span></div>
<div class="fx-row"><span class="lab">TRBL</span><div class="hfader" id="trblA"></div><span class="val" id="trblAv">0</span></div>
<div class="fx-row"><span class="lab">DELAY</span><div class="hfader" id="dlyA"></div><span class="val" id="dlyAv">0</span></div>
</div>
<button class="inv" id="invA">INV</button>
</div>
</section>
<section class="mixer panel">
<span class="panel-tag">MIXER</span>
<button class="swap-btn" id="swapBtn">⇄</button>
<button class="sync" id="syncBtn">SYNC</button>
<div class="mini-vu">
<div class="mini-col"><span class="lab">A</span><div class="mini-bar"><i id="vuAi"></i></div></div>
<div class="mini-col"><span class="lab">M</span><div class="mini-bar"><i id="vuMi"></i></div></div>
<div class="mini-col"><span class="lab">B</span><div class="mini-bar"><i id="vuBi"></i></div></div>
</div>
<div class="vert-faders">
<div class="vfader"><span class="lab">A</span><div class="track" id="fadA"><div class="fill"></div><div class="thumb"></div></div></div>
<div class="vfader"><span class="lab">B</span><div class="track" id="fadB"><div class="fill"></div><div class="thumb"></div></div></div>
</div>
<div class="xfade-round" id="xf"><div class="rail"></div><div class="ball"></div></div>
</section>
<section class="deck panel" data-d="B">
<span class="panel-tag">DECK B</span>
<input type="file" id="fileB" accept="audio/*" hidden>
<button class="vinyl empty" id="vinylB"><span class="disc"><span class="lab">B</span></span></button>
<div class="lcd title" id="titleB">— NO TRACK —<small>BPM <b class="bpm-big" id="bpmB">---</b></small></div>
<div class="lcd time" id="timeB">00:00 / 00:00</div>
<div class="transport"><button class="cbtn play" id="playB">▶</button><button class="cbtn loop" id="loopB">↻</button></div>
<div class="fx-block">
<div class="fx-rows">
<div class="fx-row"><span class="lab">BASS</span><div class="hfader" id="bassB"></div><span class="val" id="bassBv">0</span></div>
<div class="fx-row"><span class="lab">TRBL</span><div class="hfader" id="trblB"></div><span class="val" id="trblBv">0</span></div>
<div class="fx-row"><span class="lab">DELAY</span><div class="hfader" id="dlyB"></div><span class="val" id="dlyBv">0</span></div>
</div>
<button class="inv" id="invB">INV</button>
</div>
</section>
</main>
<footer class="statusbar"><span class="led" id="led"></span><span id="statusTxt">Ready • Load Tracks</span></footer>
</div>

<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=s=>{s=Math.max(0,s|0);return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

function makeDeck(key){
  const el=id=>$("#"+id+key);
  return {key,buffer:null,name:"",bpm:null,rate:1,offset:0,playing:false,loop:false,invOn:false,
    vol:.8,trbl:0,bassv:0,dly:0,src:null,startT:0,stopFlag:false,
    inNode:null,dryG:null,wetG:null,invG:null,invHP:null,invLP:null,invPeak:null,
    tr:null,bs:null,dlyN:null,fb:null,wet:null,chan:null,xg:null,an:null,td:null,
    vinyl:el("vinyl"),titleEl:el("title"),bpmEl:el("bpm"),timeEl:el("time"),
    playBtn:el("play"),loopBtn:el("loop"),invBtn:el("inv"),file:el("file")};
}
const D={A:makeDeck("A"),B:makeDeck("B")};

let AC=null, master, recDest;
const taper=v=>Math.pow(v,1.5);

function ensureAC(){
  if(AC){ if(AC.state==="suspended")AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.95; master.connect(AC.destination);
  recDest=AC.createMediaStreamDestination(); master.connect(recDest);
  for(const k of ["A","B"]) buildChain(D[k]);
  applyXF();
}

function buildChain(d){
  // Вход
  d.inNode = AC.createGain();

  // DRY (обычный звук)
  d.dryG = AC.createGain(); d.dryG.gain.value = 1;

  // WET (INV) — фаза -1 + HPF 400 + LPF 4k + peak +12дБ@1к
  d.wetG = AC.createGain(); d.wetG.gain.value = 0;
  d.invG = AC.createGain(); d.invG.gain.value = -1;
  d.invHP = AC.createBiquadFilter(); d.invHP.type="highpass"; d.invHP.frequency.value=400;  d.invHP.Q.value=1.2;
  d.invLP = AC.createBiquadFilter(); d.invLP.type="lowpass";  d.invLP.frequency.value=3500; d.invLP.Q.value=1.2;
  d.invPeak = AC.createBiquadFilter(); d.invPeak.type="peaking"; d.invPeak.frequency.value=1000; d.invPeak.Q.value=2.5; d.invPeak.gain.value=12;

  // EQ
  d.tr=AC.createBiquadFilter(); d.tr.type="highshelf"; d.tr.frequency.value=3200; d.tr.gain.value=d.trbl;
  d.bs=AC.createBiquadFilter(); d.bs.type="lowshelf";  d.bs.frequency.value=210;  d.bs.gain.value=d.bassv;

  // Delay
  d.dlyN=AC.createDelay(1.6); d.dlyN.delayTime.value=d.dly/1000;
  d.fb=AC.createGain(); d.fb.gain.value=.45;
  d.wet=AC.createGain(); d.wet.gain.value=0;

  // Канал
  d.chan=AC.createGain(); d.chan.gain.value=taper(d.vol);
  d.xg=AC.createGain();
  d.an=AC.createAnalyser(); d.an.fftSize=512; d.td=new Uint8Array(512);

  // Соединения
  d.inNode.connect(d.dryG);
  d.inNode.connect(d.invG);
  d.invG.connect(d.invHP);
  d.invHP.connect(d.invLP);
  d.invLP.connect(d.invPeak);
  d.invPeak.connect(d.wetG);

  d.dryG.connect(d.tr);
  d.wetG.connect(d.tr);

  d.tr.connect(d.bs);
  d.bs.connect(d.chan);
  d.bs.connect(d.dlyN); d.dlyN.connect(d.fb); d.fb.connect(d.dlyN); d.dlyN.connect(d.wet); d.wet.connect(d.chan);
  d.chan.connect(d.an); d.an.connect(d.xg); d.xg.connect(master);

  // Отладка
  console.log("[buildChain "+d.key+"] dryG=", d.dryG.gain.value, "wetG=", d.wetG.gain.value);
}

let xfVal=.5;
function applyXF(){ if(!AC)return;
  D.A.xg.gain.value=Math.cos(xfVal*Math.PI/2);
  D.B.xg.gain.value=Math.cos((1-xfVal)*Math.PI/2);
}

const posOf=d=>d.playing? d.offset+(AC.currentTime-d.startT)*d.rate : d.offset;

function startDeck(d){
  const src=AC.createBufferSource();
  src.buffer=d.buffer; src.loop=d.loop; src.playbackRate.value=d.rate;
  src.connect(d.inNode);
  d.src=src; d.startT=AC.currentTime; d.playing=true; d.stopFlag=false;
  src.onended=()=>{ if(d.stopFlag)return;
    d.playing=false; d.offset=0; d.src=null; syncUI(d);
    d.timeEl.textContent="00:00 / "+fmt(d.buffer.duration);
    setStatus("Deck "+d.key+" — трек завершён",""); };
  src.start(0, d.offset % d.buffer.duration);
  d.vinyl.classList.add("spinning");
}
function pauseDeck(d){ if(!d.playing)return;
  d.stopFlag=true; d.offset=posOf(d);
  try{d.src.stop()}catch(e){}
  d.src=null; d.playing=false; d.vinyl.classList.remove("spinning");
}
function togglePlay(d){
  ensureAC();
  if(!d.buffer){ setStatus("Deck "+d.key+": нажмите на пластинку",""); return; }
  d.playing? pauseDeck(d) : startDeck(d);
  syncUI(d);
}
function syncUI(d){
  d.playBtn.textContent=d.playing?"❚❚":"▶";
  d.playBtn.classList.toggle("on",d.playing);
  d.loopBtn.classList.toggle("on",d.loop);
  d.invBtn.classList.toggle("on",d.invOn);
}

function loadFile(d,file){
  ensureAC();
  setStatus("Чтение «"+file.name+"»…","");
  file.arrayBuffer().then(ab=>new Promise(res=>AC.decodeAudioData(ab,res))).then(buf=>{
    pauseDeck(d);
    d.buffer=buf; d.offset=0; d.rate=1; d.bpm=null;
    d.name=file.name.replace(/\.[^.]+$/,"");
    d.titleEl.firstChild.nodeValue=d.name;
    d.titleEl.title=file.name;
    d.bpmEl.textContent="···";
    d.timeEl.textContent="00:00 / "+fmt(buf.duration);
    d.vinyl.classList.remove("empty");
    setStatus("Deck "+d.key+": анализ BPM…","");
    setTimeout(()=>{ d.bpm=detectBPM(buf); d.bpmEl.textContent=d.bpm.toFixed(0);
      setStatus("Deck "+d.key+" • "+d.bpm.toFixed(1)+" BPM","ok"); },80);
  }).catch(()=>setStatus("Ошибка декодирования",""));
}
function detectBPM(buffer){
  const sr=buffer.sampleRate,L=buffer.getChannelData(0),
        R=buffer.numberOfChannels>1?buffer.getChannelData(1):null;
  const maxS=Math.min(L.length,sr*50), hop=Math.max(256,sr*.02|0), N=maxS/hop|0;
  if(N<10)return 120;
  const env=new Float32Array(N);
  for(let i=0;i<N;i++){let s=0;const b=i*hop,e=Math.min(b+hop,maxS);
    for(let j=b;j<e;j+=2){let v=L[j]; if(R)v=(v+R[j])*.5; s+=v<0?-v:v;}
    env[i]=s/((e-b)/2);}
  const os=new Float32Array(N);
  for(let i=1;i<N;i++){const dv=env[i]-env[i-1]; os[i]=dv>0?dv:0;}
  let m=0; for(let i=0;i<N;i++)m+=os[i]; m/=N;
  for(let i=0;i<N;i++)os[i]-=m;
  const hopSec=hop/sr; let best=0,bpm0=120;
  for(let bpm=70;bpm<=190;bpm+=.5){
    const lag=Math.round(60/(bpm*hopSec)); if(lag>=N)continue;
    let c=0,e1=0,e2=0;
    for(let i=lag;i<N;i++){c+=os[i]*os[i-lag]; e1+=os[i]*os[i]; e2+=os[i-lag]*os[i-lag];}
    const sc=c/Math.sqrt(e1*e2+1e-9);
    if(sc>best){best=sc;bpm0=bpm;}
  }
  let b=bpm0; while(b<75)b*=2; while(b>178)b/=2;
  return Math.round(b*10)/10;
}

let recorder=null,recStart=0,recTimer=null,chunks=[];
const recBtn=$("#recBtn"), recTime=$("#recTime");
function stopRecUI(){ clearInterval(recTimer); recTimer=null; recBtn.classList.remove("on"); recTime.textContent="00:00"; }
function toggleRec(){
  ensureAC();
  if(recorder&&recorder.state==="recording"){ try{recorder.stop()}catch(e){} return; }
  if(!AC){ setStatus("Аудио не инициализировано","rec"); return; }
  if(AC.state==="suspended") AC.resume();
  if(!window.MediaRecorder){ setStatus("Браузер не поддерживает запись","rec"); return; }
  if(!D.A.playing && !D.B.playing){ setStatus("Нечего записывать — включите трек","rec"); return; }
  const mime=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4","audio/mpeg"]
    .find(m=>{try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}})||"";
  try{ recorder=new MediaRecorder(recDest.stream, mime?{mimeType:mime}:undefined); }
  catch(e){ setStatus("Ошибка рекордера: "+e.message,"rec"); recorder=null; return; }
  chunks=[];
  recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop=()=>{
    const type=recorder.mimeType||mime||"audio/webm";
    const ext=type.includes("mpeg")?"mp3":type.includes("mp4")?"m4a":type.includes("ogg")?"ogg":"webm";
    const blob=new Blob(chunks,{type});
    if(!blob.size){ setStatus("Запись пустая","rec"); stopRecUI(); recorder=null; return; }
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="DJBOX-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+"."+ext;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    setStatus("Сохранено: "+a.download,"ok");
    stopRecUI(); recorder=null;
  };
  try{ recorder.start(500); }
  catch(e){ setStatus("Не удалось начать: "+e.message,"rec"); recorder=null; return; }
  recStart=Date.now();
  recBtn.classList.add("on");
  led.className="led rec";
  recTimer=setInterval(()=>{ recTime.textContent=fmt((Date.now()-recStart)/1000); },250);
  setStatus("● Recording...","rec");
}

const led=$("#led"), statusTxt=$("#statusTxt");
function setStatus(t,mode=""){
  statusTxt.textContent=t;
  led.className="led "+(mode||"");
}

function makeHFader(el,o){
  el.innerHTML='<div class="rail"></div><div class="fill"></div><div class="thumb"></div>';
  const rail=$(".rail",el),fill=$(".fill",el),th=$(".thumb",el);
  let v=(o.val-o.min)/(o.max-o.min);
  const render=()=>{ fill.style.width=(v*100)+"%"; th.style.left=(v*100)+"%"; };
  function set(nv,fire=true){ nv=clamp(nv,0,1); v=nv; render();
    if(fire){ const real=o.min+(o.max-o.min)*v; o.onChange(o.step?Math.round(real/o.step)*o.step:real); } }
  const fromEv=e=>{const r=rail.getBoundingClientRect();set((e.clientX-r.left)/r.width);};
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId); fromEv(e);
    const mv=ev=>fromEv(ev);
    const up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  });
  el.addEventListener("dblclick",()=>set((o.def-o.min)/(o.max-o.min)));
  render(); return {set};
}
function makeVFader(el,{val=.8,onInput}){
  const fill=$(".fill",el),th=$(".thumb",el);
  let v=val;
  const render=()=>{ fill.style.height=(v*100)+"%"; th.style.bottom=(v*100)+"%"; };
  function set(nv,fire=true){ v=clamp(nv,0,1); render(); if(fire)onInput(v); }
  const fromEv=e=>{const r=el.getBoundingClientRect();set(1-(e.clientY-r.top)/r.height);};
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId); fromEv(e);
    const mv=ev=>fromEv(ev);
    const up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  });
  el.addEventListener("dblclick",()=>set(.8));
  render(); return {set};
}
function makeXfade(el,onInput){
  const ball=$(".ball",el);
  let v=.5;
  const render=()=>{ ball.style.left=(10+(el.clientWidth-20)*v)+"px"; };
  function set(nv,fire=true){ v=clamp(nv,0,1); render(); if(fire)onInput(v); }
  const fromEv=e=>{const r=$(".rail",el).getBoundingClientRect();set((e.clientX-r.left)/r.width);};
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId); fromEv(e);
    const mv=ev=>fromEv(ev);
    const up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  });
  el.addEventListener("dblclick",()=>set(.5));
  requestAnimationFrame(render);
  window.addEventListener("resize",render);
  render(); return {set};
}

function lvl(d){ if(!d.an||!d.playing)return 0;
  d.an.getByteTimeDomainData(d.td);
  let s=0; for(let i=0;i<512;i+=2){const x=(d.td[i]-128)/128;s+=x*x;}
  return Math.min(1,Math.sqrt(s/256)*2.3);
}
const vuAi=$("#vuAi"),vuMi=$("#vuMi"),vuBi=$("#vuBi");
let vuALvl=0,vuBLvl=0,vuMlvl=0;
function renderVU(){
  const a=lvl(D.A), b=lvl(D.B);
  vuALvl=Math.max(a,vuALvl*.88); vuBLvl=Math.max(b,vuBLvl*.88);
  vuMlvl=Math.max((a+b)/2*0.9,vuMlvl*.88);
  vuAi.style.height=(vuALvl*100)+"%";
  vuBi.style.height=(vuBLvl*100)+"%";
  vuMi.style.height=(vuMlvl*100)+"%";
  vuAi.classList.toggle("peak",vuALvl>.85);
  vuBi.classList.toggle("peak",vuBLvl>.85);
  vuMi.classList.toggle("peak",vuMlvl>.85);
}

for(const k of ["A","B"]){
  const d=D[k];
  makeHFader($("#bass"+k),{min:-24,max:24,val:0,def:0,step:1,
    onChange:v=>{ d.bassv=v; $("#bass"+k+"v").textContent=(v>0?"+":"")+v; if(AC)d.bs.gain.value=v; }});
  makeHFader($("#trbl"+k),{min:-24,max:24,val:0,def:0,step:1,
    onChange:v=>{ d.trbl=v; $("#trbl"+k+"v").textContent=(v>0?"+":"")+v; if(AC)d.tr.gain.value=v; }});
  makeHFader($("#dly"+k),{min:0,max:1000,val:0,def:0,step:10,
    onChange:v=>{ d.dly=v; $("#dly"+k+"v").textContent=Math.round(v);
      if(AC){ d.dlyN.delayTime.setTargetAtTime(v/1000,AC.currentTime,.02);
              d.wet.gain.setTargetAtTime(v>0?.55:0,AC.currentTime,.02); }}});

  d.vinyl.addEventListener("click",()=>d.file.click());
  d.file.addEventListener("change",e=>{const f=e.target.files[0];if(f)loadFile(d,f);e.target.value="";});
  d.playBtn.addEventListener("click",()=>togglePlay(d));
  d.loopBtn.addEventListener("click",()=>{ d.loop=!d.loop; if(d.src)d.src.loop=d.loop; syncUI(d);
    setStatus("Deck "+k+": Loop "+(d.loop?"ON ↻":"OFF"),""); });

  d.invBtn.addEventListener("click",()=>{
    ensureAC();
    if(AC.state==="suspended") AC.resume();
    if(!d.dryG || !d.wetG){ setStatus("INV: граф не готов, нажмите ▶",""); return; }
    d.invOn = !d.invOn;
    const t = AC.currentTime;
    d.dryG.gain.cancelScheduledValues(t);
    d.wetG.gain.cancelScheduledValues(t);
    d.dryG.gain.setValueAtTime(d.invOn?0:1, t);
    d.wetG.gain.setValueAtTime(d.invOn?1:0, t);
    d.invBtn.classList.toggle("on",d.invOn);
    setStatus("Deck "+d.key+": INV "+(d.invOn?"ON":"OFF"),"");
  });
}
makeVFader($("#fadA"),{val:.8,onInput:v=>{D.A.vol=v;if(AC)D.A.chan.gain.value=taper(v);}});
makeVFader($("#fadB"),{val:.8,onInput:v=>{D.B.vol=v;if(AC)D.B.chan.gain.value=taper(v);}});
makeXfade($("#xf"),v=>{xfVal=v;applyXF();});

$("#syncBtn").addEventListener("click",()=>{
  ensureAC();
  if(!D.A.buffer||!D.B.buffer||!D.A.bpm||!D.B.bpm){setStatus("SYNC: загрузите треки в оба дека","");return;}
  const r=D.A.bpm/D.B.bpm;
  if(D.B.playing){D.B.offset=posOf(D.B);D.B.startT=AC.currentTime;D.B.src.playbackRate.value=r;}
  D.B.rate=r;
  setStatus("SYNC: Deck B → "+(D.B.bpm*r).toFixed(1)+" BPM","ok");
});
$("#swapBtn").addEventListener("click",()=>{
  pauseDeck(D.A);pauseDeck(D.B);
  for(const p of ["buffer","name","bpm","rate"]){const t=D.A[p];D.A[p]=D.B[p];D.B[p]=t;}
  D.A.offset=D.B.offset=0;
  for(const k of ["A","B"]){const d=D[k];
    d.titleEl.firstChild.nodeValue=d.buffer?d.name:"— NO TRACK —";
    d.bpmEl.textContent=d.bpm?d.bpm.toFixed(0):"---";
    d.timeEl.textContent=d.buffer?"00:00 / "+fmt(d.buffer.duration):"00:00 / 00:00";
    d.vinyl.classList.toggle("empty",!d.buffer); syncUI(d);}
  setStatus("Треки обменены ⇄","ok");
});
recBtn.addEventListener("click",toggleRec);

addEventListener("keydown",e=>{
  if(e.code==="Space"&&!e.target.closest("button")){e.preventDefault();togglePlay(D.A.buffer?D.A:D.B);}
});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".hfader,.track,.xfade-round,.vinyl"))e.preventDefault();});
document.addEventListener("pointerdown",()=>{if(AC&&AC.state==="suspended")AC.resume();},{capture:true});

(function tick(){
  requestAnimationFrame(tick);
  for(const k of ["A","B"]){const d=D[k];
    if(d.buffer&&d.playing)d.timeEl.textContent=fmt(posOf(d))+" / "+fmt(d.buffer.duration);
  }
  renderVU();
})();
</script>
